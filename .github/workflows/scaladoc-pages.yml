name: Scaladoc Pages

on:
  push:
    branches: ["main"]
  pull_request:
  release:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y curl llvm libclang-dev

      - name: Build Scaladoc
        run: ./mill scalaDocGenerated

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload Scaladoc
        uses: actions/upload-pages-artifact@v4
        with:
          path: out/scalaDocGenerated.dest/javadoc

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    permissions:
      pages: write
      id-token: write
    steps:
      - name: Deploy to GitHub Pages
        # Only actually publish if new tag
        # if: startsWith(github.ref, 'refs/tags/')
        id: deployment
        uses: actions/deploy-pages@v5
